# Presentation deck metadata, slide order and per-slide layout.
#
# The counterpart of report/metadata.yaml, and deliberately shaped like it. The
# pipeline is the same one (DR-016 extends DR-015), the fact locks are the same file
# (report/facts.yaml - this deck has no facts of its own), and a slide is included
# only if its source file exists, exactly as a report section is.
#
# ---------------------------------------------------------------------------------
# 2026-08-14: THE DURATION IS NOW KNOWN, AND IT RESTRUCTURED THE DECK.
#
# The authoritative slot is 20:00 TOTAL, including the live demo. The first deck was
# built when no duration was recorded anywhere in this repository, ran to 26 slides and
# an estimated 26.4 minutes of narration, and did not fit. It was cut to 15 slides
# against the budget below - see DR-017.
#
# `tier` no longer carries the shortening strategy, because there is no longer room to
# shorten by cutting: the deck is already at the size the slot allows. Every slide is
# `core` except the two that a genuinely over-running talk can still drop.
# ---------------------------------------------------------------------------------

document:
  title: DeckForge AI
  subtitle: A locally fine-tuned diffusion model for skateboard decals, on 8 GB of VRAM
  event: Bachelor defence
  author: Kylian Algoet
  programme: Multimedia & Creative Technologies
  institution: Erasmushogeschool Brussel
  date: 2026-09-02
  repository: https://github.com/KylianAlgoet/Selftrained-and-deployed-AI-image-generator
  planning: https://github.com/users/KylianAlgoet/projects/1

# Layout budgets. Exceeding one is a HARD build failure, because a slide that overflows
# its fixed height does not error - it silently spills onto a second page, and the
# reader of a PDF may not notice. This is the deterministic half of the overflow
# defence; the human visual gate is the other half.
#
# Every budget was TIGHTENED on 2026-08-14. The first deck's budgets allowed
# report-density text on a slide - up to 900 visible characters - which is readable on
# a laptop and not from the back of a room. The rule now is one central claim per
# slide, so the budgets enforce it rather than trusting the author to.
layouts:
  title:       {max_bullets: 0, max_chars: 260}
  statement:   {max_bullets: 3, max_chars: 430}
  bullets:     {max_bullets: 5, max_chars: 580}
  split:       {max_bullets: 4, max_chars: 470}
  figure:      {max_bullets: 3, max_chars: 360}
  two-figures: {max_bullets: 3, max_chars: 390}
  table:       {max_bullets: 2, max_chars: 560}
  demo:        {max_bullets: 3, max_chars: 300}

slides:
  - {n: 1,  id: title,           file: 01-title.md,           tier: core,       layout: title,       title: "DeckForge AI"}
  - {n: 2,  id: assignment,      file: 02-assignment.md,      tier: core,       layout: statement,   title: "The assignment, and the question under it"}
  - {n: 3,  id: method,          file: 03-method.md,          tier: core,       layout: figure,      title: "One constraint, and how the work was done"}
  - {n: 4,  id: dataset,         file: 04-dataset.md,         tier: core,       layout: split,       title: "The dataset was built, not downloaded"}
  - {n: 5,  id: base-model,      file: 05-base-model.md,      tier: core,       layout: split,       title: "SDXL was better, and was rejected"}
  - {n: 6,  id: conditioning,    file: 06-conditioning.md,    tier: core,       layout: split,       title: "The free method lost"}
  - {n: 7,  id: lora,            file: 07-lora.md,            tier: core,       layout: two-figures, title: "Training longer made it less obedient"}
  - {n: 8,  id: limits,          file: 08-limits.md,          tier: core,       layout: split,       title: "What did not work"}
  - {n: 9,  id: system,          file: 09-system.md,          tier: core,       layout: figure,      title: "The integrated system"}
  - {n: 10, id: testing,         file: 10-testing.md,         tier: supporting, layout: bullets,     title: "Testing, and what it cannot tell you"}
  - {n: 11, id: reproducibility, file: 11-reproducibility.md, tier: core,       layout: split,       title: "Reproducible has halves"}
  - {n: 12, id: deployment,      file: 12-deployment.md,      tier: supporting, layout: bullets,     title: "Local, and chosen"}
  - {n: 13, id: conclusions,     file: 13-conclusions.md,     tier: core,       layout: statement,   title: "Conclusions"}
  - {n: 14, id: demo,            file: 14-demo.md,            tier: core,       layout: demo,        title: "Live demo"}
  - {n: 15, id: close,           file: 15-close.md,           tier: core,       layout: bullets,     title: "What I would change"}

build:
  output_pdf: deliverables/DeckForge-AI-presentation.pdf
  output_html: deliverables/DeckForge-AI-presentation.html
  notes_pdf: deliverables/DeckForge-AI-presentation-notes.pdf
  notes_html: deliverables/DeckForge-AI-presentation-notes.html
  # Chrome is a build prerequisite, inherited from DR-015. Tried in order.
  chrome_candidates:
    - C:/Program Files/Google/Chrome/Application/chrome.exe
    - C:/Program Files (x86)/Google/Chrome/Application/chrome.exe
    - C:/Program Files (x86)/Microsoft/Edge/Application/msedge.exe

# ------------------------------------------------------------------------ timing ---
#
# The binding constraint of the whole deck, and the reason it is 15 slides.
#
# Narration is ESTIMATED from the speaker notes' word count at `words_per_minute`. It
# is not a rehearsal time, and no rehearsal has been run - see DR-017. 130 wpm is a
# deliberately slow defence pace, chosen so the estimate errs toward over-running
# rather than under-running.
#
# The demo is NOT counted as zero. Its slide note is a set of directions rather than a
# script, so it is excluded from the word-count total and its two real costs are
# declared here instead: the spoken handoff, and the demo itself.
#
#     narration = sum(word-count estimate of every non-demo slide) + demo_handoff
#     combined  = narration + demo
#     buffer    = total_budget - combined
#
# `narration_min_seconds`/`narration_max_seconds` are a HARD build failure in both
# directions. Over the maximum is an overrun. Under the minimum matters too: it means
# the estimate has drifted far enough from the design that the buffer is no longer the
# one that was reasoned about, and it usually means a note was gutted rather than cut.
timing:
  words_per_minute: 130
  total_budget_seconds: 1200        # the authoritative slot: 20:00, demo included
  demo_target_seconds: 240          # ~4:00, timed separately by docs/presentation/demo-script.md
  demo_handoff_seconds: 15          # spoken while moving to the browser
  narration_min_seconds: 870        # 14:30
  narration_max_seconds: 900        # 15:00
  min_buffer_seconds: 60            # 1:00 for transitions, pauses and timing variation
  # Advisory per-slide ceiling. Raised from 75s to 90s when the 20-minute budget was
  # confirmed: a major comparison slide is allowed up to ~1:30 by design. The ceiling
  # is now the weaker of the two timing checks - the total above is what binds.
  note_ceiling_seconds: 90
