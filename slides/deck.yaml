# Presentation deck metadata, slide order and per-slide layout.
#
# The counterpart of report/metadata.yaml, and deliberately shaped like it. The
# pipeline is the same one (DR-016 extends DR-015), the fact locks are the same file
# (report/facts.yaml - this deck has no facts of its own), and a slide is included
# only if its source file exists, exactly as a report section is.
#
# `tier` exists because NO authoritative presentation duration is recorded anywhere in
# this repository - searched 2026-08-11 across the brief, the planning, the governing
# prompt and the report sources; see DR-016. The slide count is therefore PROVISIONAL.
# A `supporting` slide can be cut, and when it is, its content folds into the adjacent
# `core` slide's speaker notes rather than being deleted. A shorter cut costs stage
# time; it never costs a claim.

document:
  title: DeckForge AI
  subtitle: A locally fine-tuned diffusion model for skateboard decals, on 8 GB of VRAM
  event: Bachelor defence
  author: Kylian Algoet
  programme: Multimedia & Creative Technologies
  institution: Erasmushogeschool Brussel
  date: 2026-09-02
  repository: https://github.com/KylianAlgoet/Selftrained-and-deployed-AI-image-generator
  planning: https://github.com/users/KylianAlgoet/projects/1

# Layout budgets. Exceeding one is a HARD build failure, because a slide that overflows
# its fixed height does not error - it silently spills onto a second page, and the
# reader of a 26-page PDF may not notice. This is the deterministic half of the overflow
# defence; the human visual gate is the other half.
layouts:
  title:       {max_bullets: 0,  max_chars: 320}
  statement:   {max_bullets: 3,  max_chars: 620}
  bullets:     {max_bullets: 6,  max_chars: 900}
  split:       {max_bullets: 5,  max_chars: 700}
  figure:      {max_bullets: 3,  max_chars: 600}
  two-figures: {max_bullets: 4,  max_chars: 620}
  table:       {max_bullets: 2,  max_chars: 900}
  demo:        {max_bullets: 4,  max_chars: 480}

slides:
  - {n: 1,  id: title,             file: 01-title.md,             tier: core,       layout: title,       title: "DeckForge AI"}
  - {n: 2,  id: assignment,        file: 02-assignment.md,        tier: core,       layout: bullets,     title: "The assignment, and the problem underneath it"}
  - {n: 3,  id: research-question, file: 03-research-question.md, tier: core,       layout: statement,   title: "The research question"}
  - {n: 4,  id: constraint,        file: 04-constraint.md,        tier: core,       layout: statement,   title: "One constraint governs everything"}
  - {n: 5,  id: method,            file: 05-method.md,            tier: core,       layout: bullets,     title: "How the work was done"}
  - {n: 6,  id: ladder,            file: 06-prototype-ladder.md,  tier: core,       layout: figure,      title: "The prototype ladder"}
  - {n: 7,  id: dataset,           file: 07-dataset.md,           tier: core,       layout: split,       title: "The dataset was built, not downloaded"}
  - {n: 8,  id: licensing,         file: 08-licensing.md,         tier: core,       layout: bullets,     title: "Licensing, decided before training"}
  - {n: 9,  id: base-model,        file: 09-base-model.md,        tier: core,       layout: split,       title: "Base model: SDXL was better, and was rejected"}
  - {n: 10, id: memory-habit,      file: 10-memory-habit.md,      tier: supporting, layout: statement,   title: "The habit that came out of it"}
  - {n: 11, id: conditioning,      file: 11-conditioning.md,      tier: core,       layout: split,       title: "Reference conditioning: IP-Adapter over img2img"}
  - {n: 12, id: why-lora,          file: 12-why-lora.md,          tier: core,       layout: bullets,     title: "Why LoRA, and what that does not claim"}
  - {n: 13, id: step-300,          file: 13-step-300.md,          tier: core,       layout: two-figures, title: "Training longer made it less obedient"}
  - {n: 14, id: adapters,          file: 14-adapters.md,          tier: supporting, layout: table,       title: "What actually ships"}
  - {n: 15, id: retro-poster,      file: 15-retro-poster.md,      tier: core,       layout: split,       title: "One style is a partial pass"}
  - {n: 16, id: rq4,               file: 16-rq4-inconclusive.md,  tier: core,       layout: bullets,     title: "How many images does a style need?"}
  - {n: 17, id: other-failures,    file: 17-other-failures.md,    tier: supporting, layout: bullets,     title: "The rest of what did not work"}
  - {n: 18, id: architecture,      file: 18-architecture.md,      tier: core,       layout: figure,      title: "The integrated system"}
  - {n: 19, id: mvp,               file: 19-mvp.md,               tier: core,       layout: split,       title: "The MVP, on screen"}
  - {n: 20, id: texture-fit,       file: 20-texture-fit.md,       tier: supporting, layout: two-figures, title: "A trade-off the interface admits to"}
  - {n: 21, id: testing,           file: 21-testing.md,           tier: core,       layout: bullets,     title: "Testing"}
  - {n: 22, id: determinism,       file: 22-determinism.md,       tier: core,       layout: split,       title: "Determinism has halves"}
  - {n: 23, id: deployment,        file: 23-deployment.md,        tier: core,       layout: bullets,     title: "Deployment: local, and chosen"}
  - {n: 24, id: conclusions,       file: 24-conclusions.md,       tier: core,       layout: bullets,     title: "Conclusions"}
  - {n: 25, id: demo,              file: 25-demo.md,              tier: core,       layout: demo,        title: "Live demo"}
  - {n: 26, id: close,             file: 26-close.md,             tier: core,       layout: bullets,     title: "Learning outcomes, and what I would change"}

build:
  output_pdf: deliverables/DeckForge-AI-presentation.pdf
  output_html: deliverables/DeckForge-AI-presentation.html
  notes_pdf: deliverables/DeckForge-AI-presentation-notes.pdf
  notes_html: deliverables/DeckForge-AI-presentation-notes.html
  # Chrome is a build prerequisite, inherited from DR-015. Tried in order.
  chrome_candidates:
    - C:/Program Files/Google/Chrome/Application/chrome.exe
    - C:/Program Files (x86)/Google/Chrome/Application/chrome.exe
    - C:/Program Files (x86)/Microsoft/Edge/Application/msedge.exe

# Spoken-time estimation. Reported as an ESTIMATE with its method, never as a measured
# rehearsal time - no rehearsal has been run. 130 wpm is a deliberate, slightly slow
# defence pace; the estimate is derived from the speaker notes' word count.
timing:
  words_per_minute: 130
  demo_target_minutes: 4
