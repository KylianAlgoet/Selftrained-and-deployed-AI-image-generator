# DeckForge AI - continuous integration
#
# WHAT THIS CAN AND CANNOT PROVE.
#
# A GitHub runner has no NVIDIA GPU, no CUDA, and none of the three production
# LoRA adapters - they are unregenerable artifacts (R14) that are deliberately
# not in Git. So this workflow proves that the code, the contracts, the upload
# rules, the frontend and the browser workflow are sound. It proves NOTHING
# about generation quality, VRAM, latency or adapter integrity. Those live in
# experiments/registry.csv, EXP-034/EXP-035 and scripts/validate_p5_api.py,
# measured on the validated RTX 4060 Laptop GPU, and CI is not a substitute.
#
# It never loads a model, never downloads a checkpoint, and never generates an
# image. If a change ever makes it try to, that change is wrong.
#
# windows-latest, not ubuntu: Windows 11 + PowerShell 5.1 is the ONLY platform
# this project has ever been validated on, and the deployment (DR-014) is
# native Windows. Running CI on Linux would test a configuration nobody
# supports and would quietly imply cross-platform support that was never
# established.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: pytest (no GPU, no weights)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install PyTorch (CPU build)
        # DELIBERATELY DIFFERENT FROM PRODUCTION. The validated environment runs
        # torch 2.13.0+cu126 from PyTorch's own CUDA index; a runner has no GPU,
        # so the CPU wheel of the same version is installed instead. This means
        # CI does NOT validate the production dependency set - it validates the
        # code against the same library versions. The clean-clone test is what
        # validates the real install, and it runs on the real hardware.
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.13.0 torchvision==0.28.0

      - name: Install dependencies
        run: |
          python -m pip install -r ml/requirements.txt
          python -m pip install -r ml/requirements-inference.txt
          python -m pip install -r ml/requirements-training.txt
          python -m pip install -r apps/api/requirements.txt

      - name: Confirm no production weights are present
        # The suite must pass WITHOUT them. Verified locally on 2026-08-09 by
        # moving outputs/lora aside: all 469 tests still passed, because the
        # checkpoint tests build their own adapter files under tmp_path rather
        # than reading the real ones. This step asserts the runner really is in
        # that state, so a green build can never be explained by weights having
        # leaked into the repository.
        shell: pwsh
        run: |
          if (Test-Path "outputs/lora") {
            Write-Error "outputs/lora exists on the runner - model weights must never be committed"
            exit 1
          }
          Write-Host "confirmed: no production weights on the runner"

      - name: Run pytest
        run: python -m pytest -q

  frontend:
    name: vitest, eslint, build
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the machine the project is validated on. The audit's
          # original v20.18.0 is superseded - see the M8 update in
          # docs/technical/environment-audit.md.
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install from the lockfile
        working-directory: apps/web
        run: npm ci

      - run: npm run lint
        working-directory: apps/web

      - run: npm run test
        working-directory: apps/web

      - run: npm run typecheck:e2e
        working-directory: apps/web

      - run: npm run build
        working-directory: apps/web

      - name: Confirm the production bundle exposes no E2E handle
        # The camera read-out the Playwright suite measures against is gated on
        # a build-time constant and is supposed to disappear from an ordinary
        # build. That is a claim about tree-shaking, so it is checked here
        # against the dist/ this job just produced - with no VITE_E2E set.
        working-directory: apps/web
        run: npm run verify:no-e2e-handle

  e2e:
    name: playwright (mocked API, no model)
    runs-on: windows-latest
    # 60, not 30. This is the JOB's wall-clock guard, not a test timeout. The
    # suite takes ~16-18 minutes here; on CI it also retries failed scenarios
    # twice and allows 180 s per test, so a bad run needs room to finish and
    # report rather than being killed halfway with no output at all - a killed
    # job wastes more runner minutes than a generous guard does, because it
    # produces nothing to act on.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install from the lockfile
        working-directory: apps/web
        run: npm ci

      - name: Install Chromium only
        # Chromium alone. Cross-browser rendering is not an acceptance
        # criterion and three browsers would cost ~900 MB per run.
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Run the E2E suite
        # playwright.config.ts builds the frontend before previewing it, so this
        # exercises the production bundle. Every /api/** call is answered from
        # the frozen JSON fixtures - no server, no model, no GPU.
        working-directory: apps/web
        run: npx playwright test

      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/test-results
          retention-days: 7
