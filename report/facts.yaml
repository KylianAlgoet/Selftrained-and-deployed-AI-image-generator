# Fact locks for the DeckForge AI research report.
#
# Every quantitative value the report repeats lives here once and is referenced in
# the Markdown sources as {{ facts.<key> }}. A number is therefore never typed into
# a chapter, so it cannot be current in one place and stale in another.
#
# Each fact declares HOW it is extracted from its evidence. The method matters:
# a short anchor such as "473" occurs several times in the M8 evidence index, in a
# table whose other columns hold SUPERSEDED values, so a substring search would
# happily confirm a stale number. A false-positive fact lock is worse than no fact
# lock, because it turns an unchecked value into one that looks checked.
#
# Methods, strongest first:
#
#   structural    parse the source as CSV/JSON and read a value out of the parsed
#                 object. No pattern, no possibility of a false positive.
#   exact_hash    the full 64-character hex digest must appear. Never a prefix.
#   prose_regex   a context-aware regex that must carry BOTH the fact's context and
#                 its value, and must match EXACTLY ONCE in the source. Zero matches
#                 or more than one is a test failure: an ambiguous anchor is a broken
#                 anchor.
#
# tests/test_report_facts.py asserts every entry resolves and equals its declared
# value. `python scripts/report_facts.py --check` runs the same assertions.

# ---------------------------------------------------------------- test suites ---

pytest_tests:
  value: 473
  source: docs/evidence/M8/README.md
  method: prose_regex
  # The "after the CI fix" column of the final-measured-state table. The M7 and
  # 08-09 columns hold 406 and 473, so the row must be matched whole.
  pattern: '\|\s*pytest\s*\|\s*406\s*\|\s*\*\*473\*\*\s*\|\s*\*\*(?P<value>\d+)\*\*\s*\|'
  description: pytest tests passing at the M8 close, after the CI fix

vitest_tests:
  value: 183
  source: docs/evidence/M8/README.md
  method: prose_regex
  pattern: '\|\s*vitest\s*\|\s*165\s*\|\s*\*\*169\*\*\s*\|\s*\*\*(?P<value>\d+)\*\*\s*\|'
  description: vitest tests passing at the M8 close, after the CI fix

playwright_tests:
  value: 38
  source: docs/evidence/M8/README.md
  method: prose_regex
  pattern: '\|\s*\*\*Playwright E2E\*\*\s*\|[^|]*\|\s*\*\*37\*\*\s*\|\s*\*\*(?P<value>\d+)\*\*\s*\|'
  description: Playwright E2E scenarios at the M8 close, after the CI fix

# `pytest_tests` above is the PRODUCT/RESEARCH count at the M8 close. It is not the
# whole suite, and the two must never be collapsed into one ambiguous number: M9 added
# report-validation tests that test the report rather than the system. Both halves and
# their sum are locked separately so a slide or a chapter has to choose which it means.

pytest_report_tests:
  value: 16
  source: docs/process/process-log.md
  method: prose_regex
  pattern: '\(473 pre-existing, unchanged, \+ (?P<value>\d+) new\)'
  description: report-validation tests added in M9, on top of the 473 product tests

# `pytest_total` below is the M9 CLOSE (473 + 16) and is a historical figure. M10 added
# deck-validation tests, so it is no longer the size of the suite. The two locks here are
# the CURRENT ones; a slide or chapter stating "the suite" must use `pytest_suite_total`.
pytest_deck_tests:
  value: 38
  source: docs/process/process-log.md
  method: prose_regex
  pattern: '473 system \+ 16 report-validation \+ (?P<value>\d+) deck-validation'
  description: deck-validation tests added in M10 (tests/test_slides_sources.py)

pytest_suite_total:
  value: 527
  source: docs/process/process-log.md
  method: prose_regex
  pattern: '\*\*(?P<value>\d+) pytest\*\* \(473 system'
  description: total pytest tests in a full repository run, measured 2026-08-14

pytest_total:
  value: 489
  source: docs/process/process-log.md
  method: prose_regex
  pattern: '\*\*(?P<value>\d+) pytest\*\* \(473 pre-existing'
  description: total pytest tests in a full repository run at the M9 close

