  value: 8187.5
  source: experiments/registry.csv
  method: structural
  extractor: device_total_mib
  description: total VRAM of the audited RTX 4060 Laptop GPU, in MiB

worst_spare_mib:
  value: 200.0
  source: docs/process/risk-register.md
  method: prose_regex
  pattern: 'worst observed spare is \*\*(?P<value>[\d.]+) MiB\*\*'
  description: worst spare VRAM under real serving (EXP-034); the production ceiling

oneshot_spare_mib:
  value: 202.0
  source: experiments/registry.csv
  method: structural
  extractor: exp019b_spare_mib
  description: spare VRAM for the combined stack in a one-shot process (EXP-019b)

peak_allocated_mib:
  value: 5143.73
  source: experiments/registry.csv
  method: structural
  extractor: exp019b_peak_allocated_mib
  description: peak ALLOCATED VRAM (live tensors only) of the combined stack at 512x1536

# THREE DIFFERENT MEMORY CONCEPTS. Do not subtract one from another.
#
#   allocated     live tensor bytes in the PyTorch allocator        peak 5143.73 MiB
#   reserved      the allocator's cached pool                            6872.0 MiB
#   device used   total occupancy: context + reserved pool + display     7987.5 MiB
#
# Only the last one is comparable with device_total_mib:
#   8187.5 - 7987.5 = 200.0 MiB spare.
# device_total_mib - peak_allocated_mib is 3043.77, which is NOT the margin and has
# never been the margin. The deck made exactly that subtraction and it was caught at the
# M10 content review, which is why the device figure is now locked in its own right.
worst_device_used_mib:
  value: 7987.5
  source: experiments/registry.csv
  method: structural
  extractor: exp034_worst_device_used_mib
  description: worst DEVICE-USED VRAM under real serving (EXP-034, reference-conditioned)

